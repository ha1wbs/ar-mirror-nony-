<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>مرآة AR • نوني الحرة</title>
<style>
  body {margin:0; background:#0f0f0f; color:#fff; font-family:system-ui; text-align:center;}
  #container {max-width:620px; margin:20px auto; position:relative;}
  #photo {max-width:100%; border-radius:20px; box-shadow:0 0 40px rgba(255,80,150,0.4);}
  canvas {position:absolute; top:0; left:0; pointer-events:none; border-radius:20px;}
  .controls {margin-top:20px;}
  button {background:#1a1a1a; color:#fff; border:1px solid #ff66aa; padding:12px 18px; margin:6px; border-radius:25px; font-size:15px;}
  button:hover {background:#ff4d94; color:#000;}
  .title {color:#ff99cc; font-size:22px; margin-bottom:10px;}
</style>
</head>
<body>

<div id="container">
  <div class="title">مرآة AR • نوني الحرة</div>
  <input type="file" id="upload" accept="image/*"><br><br>
  <img id="photo" style="display:none;">
  <canvas id="canvas" style="display:none;"></canvas>

  <div class="controls" style="display:none;" id="controls">
    <button onclick="strongGaze()">👁️ عيون الرجال (قوي)</button>
    <button onclick="touchEffect()">✋ لمسات قوية</button>
    <button onclick="pulseNipples()">🌸 نبض الحلمات</button>
    <button onclick="resetAll()">إعادة تعيين</button>
  </div>
</div>

<script>
const upload = document.getElementById('upload');
const photo = document.getElementById('photo');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const controls = document.getElementById('controls');

let img = new Image();
let gaze = false, touch = false, pulse = false;
let frame = 0;

upload.onchange = function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    img.src = ev.target.result;
    img.onload = function() {
      photo.src = img.src;
      photo.style.display = "block";
      canvas.width = photo.offsetWidth;
      canvas.height = photo.offsetHeight;
      canvas.style.display = "block";
      controls.style.display = "block";
      animate();
    }
  }
  reader.readAsDataURL(file);
}

function drawEffects() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  frame++;

  if (gaze) {
    ctx.fillStyle = "rgba(255, 60, 140, 0.25)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    const grad = ctx.createRadialGradient(canvas.width/2, canvas.height*0.52, 30, canvas.width/2, canvas.height*0.52, 260);
    grad.addColorStop(0, "rgba(255,100,180,0.45)");
    grad.addColorStop(1, "rgba(255,60,140,0)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  if (pulse) {
    const cx = canvas.width/2;
    const cy = canvas.height * 0.5;
    const size = 35 + Math.sin(frame/8) * 12;
    
    ctx.strokeStyle = "#ff99cc";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(cx - 60, cy, size, 0, Math.PI*2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx + 60, cy, size, 0, Math.PI*2);
    ctx.stroke();
  }

  if (touch) {
    ctx.strokeStyle = "rgba(255,150,200,0.7)";
    ctx.lineWidth = 3;
    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      ctx.arc(canvas.width/2, canvas.height*0.52, 40 + i*18 + Math.sin(frame/6)*8, 0, Math.PI*2);
      ctx.stroke();
    }
  }
}

function animate() {
  drawEffects();
  requestAnimationFrame(animate);
}

function strongGaze() { gaze = true; }
function touchEffect() { touch = true; }
function pulseNipples() { pulse = true; }
function resetAll() {
  gaze = false; touch = false; pulse = false;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}
</script>
</body>
</html>
