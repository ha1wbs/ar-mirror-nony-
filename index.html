<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>مرآة AR • صورة نوني</title>
<style>
  body {margin:0; background:#111; color:#fff; font-family:system-ui; text-align:center;}
  #container {max-width:620px; margin:20px auto; position:relative;}
  #photo {max-width:100%; border-radius:20px; box-shadow:0 0 30px rgba(255,80,150,0.3);}
  canvas {position:absolute; top:0; left:0; pointer-events:none; border-radius:20px;}
  .controls {margin-top:25px;}
  button {background:#1f1f1f; color:#fff; border:1px solid #ff99cc; padding:12px 20px; margin:8px; border-radius:25px; font-size:15px; cursor:pointer;}
  button:hover {background:#ff4d94; color:#000;}
  .title {color:#ff99cc; font-size:24px; margin:15px 0;}
</style>
</head>
<body>

<div id="container">
  <div class="title">مرآة AR • صورة نوني الحرة</div>
  
  <input type="file" id="upload" accept="image/*" style="margin:15px;">
  <br>
  <img id="photo" style="display:none;">
  <canvas id="canvas" style="display:none;"></canvas>
  
  <div class="controls" style="display:none;" id="controls">
    <button onclick="applyGaze()">👁️ عيون الرجال عليكِ</button>
    <button onclick="applyTouch()">✋ لمسات افتراضية</button>
    <button onclick="highlightNipples()">🌸 أبرزي حلماتكِ</button>
    <button onclick="resetAll()">إعادة تعيين</button>
  </div>
</div>

<script>
const upload = document.getElementById('upload');
const photo = document.getElementById('photo');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const controls = document.getElementById('controls');

let img = new Image();
let gaze = false, touch = false, nipples = false;

upload.onchange = function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    img.src = ev.target.result;
    img.onload = function() {
      photo.src = img.src;
      photo.style.display = "block";
      canvas.width = photo.offsetWidth;
      canvas.height = photo.offsetHeight;
      canvas.style.display = "block";
      controls.style.display = "block";
      drawEffects();
    }
  }
  reader.readAsDataURL(file);
}

function drawEffects() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  if (gaze) {
    ctx.fillStyle = "rgba(255, 100, 160, 0.12)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // glow on chest area
    const grad = ctx.createRadialGradient(canvas.width/2, canvas.height*0.55, 40, canvas.width/2, canvas.height*0.55, 180);
    grad.addColorStop(0, "rgba(255,120,180,0.35)");
    grad.addColorStop(1, "rgba(255,80,150,0)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  
  if (nipples) {
    ctx.strokeStyle = "rgba(255,220,240,0.7)";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(canvas.width*0.38, canvas.height*0.52, 32, 0, Math.PI*2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(canvas.width*0.62, canvas.height*0.52, 32, 0, Math.PI*2);
    ctx.stroke();
  }
  
  if (touch) {
    ctx.strokeStyle = "rgba(255,150,200,0.5)";
    ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(canvas.width/2 + (i-1)*40, canvas.height*0.55, 25 + i*8, 0, Math.PI*2);
      ctx.stroke();
    }
  }
}

function applyGaze() { gaze = true; drawEffects(); }
function applyTouch() { touch = true; drawEffects(); }
function highlightNipples() { nipples = true; drawEffects(); }
function resetAll() {
  gaze = false; touch = false; nipples = false;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}
</script>

</body>
</html>إضافة مرآة AR
